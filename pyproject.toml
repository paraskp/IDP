[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dashcam-speed-analyzer"
version = "1.0.0"
description = "Automatic monocular computer-vision and geometric speed estimation for heterogeneous dashcams"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Computer Vision Engineering Team"}
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "PySide6>=6.5.0",
    "ultralytics>=8.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dashcam-analyze = "cli.analyze:main"
dashcam-gui = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
